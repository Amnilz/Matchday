spring.application.name=matchday
app.name=Matchday

# Local configuration is excluded from Git. Environment variables take precedence.
# Keep .env values unquoted so the file also follows Java properties syntax.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:${DB_PORT:3306}/${DB_NAME:matchday}}
spring.datasource.username=${DB_USER:matchday}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Suitable for local development; use versioned migrations for hosted deployments.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.thymeleaf.cache=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.web.error.whitelabel.enabled=false

app.seed-demo-data=${SEED_DEMO_DATA:false}
# Administrator bootstrap is opt-in and never uses a bundled password.
app.admin.enabled=${ADMIN_ENABLED:false}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@example.test}
app.admin.password=${ADMIN_PASSWORD:}
app.wikipedia.user-agent=${WIKIPEDIA_USER_AGENT:Matchday/1.0 (local educational project)}
