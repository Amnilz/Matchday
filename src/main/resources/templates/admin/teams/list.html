<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Manage Teams')}">
    <title>Manage Teams</title>
</head>
<body class="d-flex flex-column min-vh-100">

<th:block th:replace="~{layout/fragments :: header}"></th:block>
<nav th:replace="~{layout/fragments :: nav}"></nav>

<main class="container my-4 flex-grow-1" data-wiki-page="teams">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Dashboard
            </a>
            <h2 class="mb-0"><i class="bi bi-shield-fill text-success me-2"></i>Manage Teams</h2>
        </div>
        <div class="d-flex gap-2">
            <th:block th:replace="~{admin/fragments :: wikiFetchBtn(@{/admin/teams/fetch-logos}, 'Fetch missing logos', 'All logos fetched', ${missingLogoCount == 0})}"></th:block>
            <a th:href="@{/admin/teams/new(returnUrl=${returnUrl})}" class="btn btn-success">
                <i class="bi bi-plus-lg me-1"></i>New Team
            </a>
        </div>
    </div>

    <th:block th:replace="~{admin/fragments :: adminSectionNav('teams')}"></th:block>

    <th:block th:replace="~{admin/fragments :: flashMessages}"></th:block>

    <th:block th:with="action=@{/admin/teams}"
              th:replace="~{shared/team-ui :: teamFilterBar(${action}, ${searchQuery}, ${leagues}, ${selectedLeagueIds}, 'col-sm-5 col-md-3', 'admin-team-league')}"></th:block>

    <div id="searchResults" th:fragment="results">

    <div th:if="${teams.isEmpty()}" class="alert alert-info">
        <th:block th:if="${searchQuery != null and !#strings.isEmpty(searchQuery)}">No teams found matching your search.</th:block>
        <th:block th:unless="${searchQuery != null and !#strings.isEmpty(searchQuery)}">No teams yet. <a th:href="@{/admin/teams/new(returnUrl=${returnUrl})}">Create the first one.</a></th:block>
    </div>

    <div th:unless="${teams.isEmpty()}" class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Team</th>
                    <th class="text-center">Players</th>
                    <th class="d-none d-md-table-cell">Description</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="team : ${teams}">
                    <td>
                        <th:block th:replace="~{shared/team-ui :: teamLink(${team}, 28, false)}"></th:block>
                    </td>
                    <td class="text-center">
                        <span class="badge bg-secondary" th:text="${team.playerCount}">0</span>
                    </td>
                    <td class="text-muted small d-none d-md-table-cell">
                        <span th:if="${team.description != null and !#strings.isEmpty(team.description)}"
                              th:text="${#strings.abbreviate(team.description, 60)}"></span>
                        <span th:unless="${team.description != null and !#strings.isEmpty(team.description)}"
                              class="fst-italic">-</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/admin/players/new(teamId=${team.id}, returnUrl=${returnUrl})}"
                           class="btn btn-sm btn-outline-success me-1 text-nowrap">
                            <i class="bi bi-person-plus me-1"></i>Add Player
                        </a>
                        <a th:href="@{/admin/teams/{id}/edit(id=${team.id}, returnUrl=${returnUrl})}"
                           class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <button type="button"
                                class="btn btn-sm btn-outline-danger"
                                data-bs-toggle="modal"
                                data-bs-target="#deleteModal"
                                th:attr="data-entity-name=${team.name}"
                                th:data-return-url="${returnUrl}"
                        th:data-delete-url="@{/admin/teams/{id}/delete(id=${team.id})}">
                            <i class="bi bi-trash me-1"></i>Delete
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

        <th:block th:replace="~{shared/pagination :: pagination(${teams}, @{/admin/teams(name=${searchQuery}, leagueId=${selectedLeagueIds})})}"></th:block>

    </div><!-- end #searchResults -->

</main>

<th:block th:replace="~{admin/fragments :: deleteModal('Team')}"></th:block>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<th:block th:replace="~{layout/fragments :: scripts}"></th:block>
<script th:src="@{/js/search.js}"></script>
<script th:src="@{/js/wiki-status.js}"></script>
</body>
</html>
