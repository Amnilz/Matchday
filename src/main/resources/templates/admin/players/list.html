<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Manage Players')}">
    <title>Manage Players</title>
</head>
<body class="d-flex flex-column min-vh-100">

<th:block th:replace="~{layout/fragments :: header}"></th:block>
<nav th:replace="~{layout/fragments :: nav}"></nav>

<main class="container my-4 flex-grow-1" data-wiki-page="players">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Dashboard
            </a>
            <h2 class="mb-0"><i class="bi bi-person-fill text-primary me-2"></i>Manage Players</h2>
        </div>
        <div class="d-flex gap-2">
            <th:block th:replace="~{admin/fragments :: wikiFetchBtn(@{/admin/players/fetch-photos}, 'Fetch missing photos', 'All photos fetched', ${missingPhotoCount == 0})}"></th:block>
            <a th:href="@{/admin/players/new(returnUrl=${returnUrl})}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>New Player
            </a>
        </div>
    </div>

    <th:block th:replace="~{admin/fragments :: adminSectionNav('players')}"></th:block>

    <th:block th:replace="~{admin/fragments :: flashMessages}"></th:block>

    <th:block th:with="action=@{/admin/players}"
              th:replace="~{shared/player-ui :: playerFilterBar(${action}, ${searchQuery}, ${leagues}, ${teams}, ${selectedLeagueIds}, ${selectedTeamIds}, ${positions}, ${selectedPositions}, false, null, null)}"></th:block>

    <div id="searchResults" th:fragment="results">

        <div th:if="${players.isEmpty()}" class="alert alert-info">
            <th:block th:if="${(searchQuery != null and !#strings.isEmpty(searchQuery)) or !selectedLeagueIds.isEmpty() or !selectedTeamIds.isEmpty() or !selectedPositions.isEmpty()}">No players found matching your filters.</th:block>
            <th:block th:unless="${(searchQuery != null and !#strings.isEmpty(searchQuery)) or !selectedLeagueIds.isEmpty() or !selectedTeamIds.isEmpty() or !selectedPositions.isEmpty()}">No players yet. <a th:href="@{/admin/players/new(returnUrl=${returnUrl})}">Add the first one.</a></th:block>
        </div>

        <div th:unless="${players.isEmpty()}" class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Player</th>
                        <th>Team</th>
                        <th class="text-center">Pos</th>
                        <th class="text-center">#</th>
                        <th class="text-center d-none d-md-table-cell">Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="player : ${players}">
                        <th:block th:replace="~{shared/player-ui :: playerNameCell(${player})}"></th:block>
                        <td>
                            <th:block th:replace="~{shared/team-ui :: teamLink(${player.team}, 22, true)}"></th:block>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-secondary" th:text="${player.position}">POS</span>
                        </td>
                        <td class="text-center text-muted" th:text="${player.shirtNumber ?: '-'}">-</td>
                        <td class="text-center d-none d-md-table-cell">
                            <span th:if="${player.active}"    class="badge bg-success">Active</span>
                            <span th:unless="${player.active}" class="badge bg-secondary">Inactive</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/admin/players/{id}/edit(id=${player.id}, returnUrl=${returnUrl})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil me-1"></i>Edit
                            </a>
                            <button type="button"
                                    class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#deleteModal"
                                     th:attr="data-entity-name=${player.fullName},
                                             data-delete-url=@{/admin/players/{id}/delete(id=${player.id})},
                                             data-return-url=${returnUrl}">
                                <i class="bi bi-trash me-1"></i>Delete
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <th:block th:replace="~{shared/pagination :: pagination(${players}, @{/admin/players(name=${searchQuery}, leagueId=${selectedLeagueIds}, teamId=${selectedTeamIds}, position=${selectedPositions})})}"></th:block>

    </div><!-- end #searchResults -->

</main>

<th:block th:replace="~{admin/fragments :: deleteModal('Player')}"></th:block>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<th:block th:replace="~{layout/fragments :: scripts}"></th:block>
<script th:src="@{/js/search.js}"></script>
<script th:src="@{/js/wiki-status.js}"></script>
</body>
</html>
