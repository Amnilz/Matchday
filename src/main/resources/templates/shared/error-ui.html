<!DOCTYPE html>
<html th:fragment="errorFullPage(title, iconClass, heading, defaultMessage)"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(${title})}">
    <title>title</title>
</head>
<body class="d-flex flex-column min-vh-100">

<th:block th:replace="~{layout/fragments :: header}"></th:block>
<nav th:replace="~{layout/fragments :: nav}"></nav>

<main class="container my-5 flex-grow-1 text-center">
    <div class="py-5">
        <i th:class="${iconClass}" style="font-size: 4rem;"></i>
        <h2 class="mt-3" th:text="${heading}">Error</h2>
        <p class="text-muted"
           th:text="${message != null ? message : defaultMessage}">The request could not be completed.</p>
        <a th:href="@{/}" class="btn btn-success mt-2">
            <i class="bi bi-house me-1"></i>Back to Home
        </a>
    </div>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<th:block th:replace="~{layout/fragments :: scripts}"></th:block>
</body>
</html>
