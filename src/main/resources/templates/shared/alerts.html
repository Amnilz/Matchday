<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- FLASH ALERT fragment — generic dismissible Bootstrap alert.
     type:    Bootstrap contextual suffix: 'success' | 'danger' | 'warning' | 'info'
     message: the text to display; renders nothing when null or blank
     Usage: th:replace="~{shared/alerts :: flashAlert('success', ${successMessage})}"
            th:replace="~{shared/alerts :: flashAlert('warning', ${commentError})}" -->
<div th:fragment="flashAlert(type, message)"
     th:if="${message != null and !#strings.isEmpty(message)}"
     th:class="'alert alert-' + ${type} + ' alert-dismissible fade show'"
     role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

</body>
</html>
