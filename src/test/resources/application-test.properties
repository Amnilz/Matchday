# Dedicated disposable database: never point TEST_DB_URL at application data.
spring.datasource.url=${TEST_DB_URL:jdbc:mariadb://127.0.0.1:3307/matchday_test}
spring.datasource.username=${TEST_DB_USER:matchday_test}
spring.datasource.password=${TEST_DB_PASSWORD:local-test-only-password}
spring.jpa.hibernate.ddl-auto=create-drop
app.seed-demo-data=true
app.admin.enabled=false
